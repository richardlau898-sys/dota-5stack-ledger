<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>刀塔账房 · 英雄攻略</title>
<style>
:root {
  color-scheme: dark;
  --bg: #141515; --panel: #1d1e1e; --panel-2: #222420; --panel-3: #282a24;
  --line: #393a38; --line-soft: #2c2d2a;
  --text: #e6e3dc; --muted: #b2afa5; --dim: #8e8f85;
  --gold: #c6a468; --gold-light: #e4c992; --gold-bg: #27251c;
  --red: #b94a3d; --red-light: #df8978;
  --green-light: #a5c6a7;
  --serif: "Songti SC", "Noto Serif SC", "STSong", Georgia, serif;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.55 var(--sans); }
body { background: radial-gradient(ellipse at top, #1b1c1a 0%, var(--bg) 60%); min-height: 100vh; }
a { color: var(--gold-light); }
.brand a.home { color: inherit; text-decoration: none; }
.brand a.home:hover { text-decoration: underline; }
.stale { color: var(--red-light); }
.wrap { max-width: 1240px; margin: 0 auto; padding: 16px; }
header.top { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 16px; border-bottom: 1px solid var(--line); padding-bottom: 12px; }
.brand { font: 700 22px/1.2 var(--serif); color: var(--gold-light); letter-spacing: 1px; }
.brand small { font: 400 14px var(--sans); color: var(--muted); margin-left: 8px; }
.meta { color: var(--muted); font-size: 13px; }
.meta b { color: var(--text); font-weight: 600; }
.layout { display: grid; grid-template-columns: 340px 1fr; gap: 16px; margin-top: 16px; align-items: start; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 3px; box-shadow: inset 0 1px 0 rgba(255,255,255,0.03); }
.picker { padding: 12px; position: sticky; top: 12px; max-height: calc(100vh - 24px); display: flex; flex-direction: column; }
.search { width: 100%; padding: 8px 10px; background: var(--bg); border: 1px solid var(--line); border-radius: 2px; color: var(--text); font-size: 14px; }
.search:focus { outline: 1px solid var(--gold); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0; }
.chip { padding: 3px 10px; border: 1px solid var(--line); border-radius: 2px; background: var(--panel-2); color: var(--muted); cursor: pointer; font-size: 13px; }
.chip.on { border-color: var(--gold); color: var(--gold-light); background: var(--gold-bg); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(72px, 1fr)); gap: 6px; overflow-y: auto; padding-right: 2px; }
.tile { position: relative; border: 1px solid var(--line-soft); border-radius: 2px; background: var(--panel-2); cursor: pointer; padding: 0; color: var(--text); text-align: left; }
.tile img { width: 100%; aspect-ratio: 16 / 9; object-fit: cover; display: block; border-radius: 2px 2px 0 0; }
.tile span { display: block; font-size: 12px; padding: 2px 4px 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile em { position: absolute; top: 2px; right: 3px; font-style: normal; font-size: 11px; color: var(--text); background: rgba(0,0,0,0.6); padding: 0 3px; border-radius: 2px; }
.tile.low { opacity: 0.45; }
.tile.sel { border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold); }
.detail { min-width: 0; }
.empty { padding: 40px 24px; color: var(--muted); text-align: center; }
.hero-head { display: grid; grid-template-columns: 160px 1fr; gap: 16px; padding: 16px; border-left: 3px solid var(--gold); }
.hero-head img { width: 160px; border-radius: 2px; border: 1px solid var(--line); }
.hero-head h1 { margin: 0; font: 700 26px/1.2 var(--serif); color: var(--gold-light); }
.hero-head h1 small { font: 400 14px var(--sans); color: var(--muted); margin-left: 8px; }
.stats { display: flex; flex-wrap: wrap; gap: 8px 20px; margin-top: 10px; }
.stat b { display: block; font: 700 20px/1.2 var(--serif); font-variant-numeric: tabular-nums; }
.stat span { color: var(--muted); font-size: 12px; }
.tabs { display: flex; gap: 6px; margin-top: 12px; flex-wrap: wrap; }
.warn { margin-top: 10px; color: var(--red-light); font-size: 13px; }
section.block { margin-top: 14px; padding: 14px 16px; }
section.block h2 { margin: 0 0 4px; font: 700 17px/1.3 var(--serif); color: var(--gold-light); display: flex; align-items: center; gap: 8px; }
section.block h2::before { content: "◆"; font-size: 10px; color: var(--gold); }
.sub { color: var(--muted); font-size: 12px; margin: 0 0 12px; border-bottom: 1px solid var(--line-soft); padding-bottom: 8px; }
.skills { overflow-x: auto; }
table.sk { border-collapse: separate; border-spacing: 3px; font-variant-numeric: tabular-nums; }
table.sk th { font-weight: 400; color: var(--dim); font-size: 11px; min-width: 30px; }
table.sk td { width: 30px; height: 30px; text-align: center; background: var(--panel-2); border-radius: 2px; font-size: 11px; color: var(--muted); }
table.sk td.on { background: var(--gold-bg); color: var(--gold-light); box-shadow: inset 0 0 0 1px var(--gold); font-weight: 600; }
table.sk td.weak { box-shadow: inset 0 0 0 1px rgba(198,164,104,0.45); background: #201f19; color: var(--muted); }
table.sk td.tal { background: #22201a; color: var(--gold); }
table.sk td.rowh { width: auto; background: none; text-align: left; white-space: nowrap; padding-right: 6px; color: var(--text); }
table.sk td.rowh img { width: 24px; height: 24px; vertical-align: middle; border-radius: 2px; margin-right: 6px; }
.orders { margin-top: 12px; display: grid; gap: 6px; }
.order { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; font-size: 13px; }
.order .seq { display: flex; gap: 2px; }
.order .seq img { width: 22px; height: 22px; border-radius: 2px; }
.num { font-variant-numeric: tabular-nums; }
.pill { display: inline-block; padding: 0 6px; border-radius: 2px; background: var(--panel-3); color: var(--muted); font-size: 12px; }
.talents { display: grid; gap: 6px; }
.trow { display: grid; grid-template-columns: 1fr 52px 1fr; gap: 8px; align-items: stretch; }
.tlv { display: flex; align-items: center; justify-content: center; font: 700 18px var(--serif); color: var(--gold); background: var(--gold-bg); border: 1px solid var(--line); border-radius: 2px; }
.topt { padding: 8px 10px; background: var(--panel-2); border: 1px solid var(--line-soft); border-radius: 2px; font-size: 13px; }
.topt.best { border-color: var(--gold); }
.topt .bar { height: 4px; background: var(--line-soft); border-radius: 2px; margin-top: 6px; overflow: hidden; }
.topt .bar i { display: block; height: 100%; background: var(--gold); }
.topt .nums { margin-top: 4px; color: var(--muted); font-size: 12px; }
.trow .topt:first-child { text-align: right; }
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; }
.col h3 { margin: 0 0 6px; font: 600 14px var(--serif); color: var(--text); }
.col h3 span { color: var(--dim); font: 400 12px var(--sans); margin-left: 6px; }
.it { display: grid; grid-template-columns: 34px 1fr auto; gap: 8px; align-items: center; padding: 4px 0; border-bottom: 1px solid var(--line-soft); font-size: 13px; }
.it:last-child { border-bottom: 0; }
.it img { width: 34px; height: 25px; object-fit: cover; border-radius: 2px; background: var(--panel-3); }
.it .r { text-align: right; color: var(--muted); font-size: 12px; white-space: nowrap; }
.it .r b { color: var(--text); font-weight: 600; }
.low-n { color: var(--dim); }
.notes { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 8px 16px; }
.ng h3 { margin: 0 0 4px; font: 600 14px var(--serif); color: var(--text); }
.ng ul { margin: 0; padding-left: 18px; color: var(--muted); font-size: 13px; }
.ng li { margin: 2px 0; }
.ng .info { display: block; color: var(--dim); font-size: 12px; }
footer { margin: 24px 0 8px; color: var(--dim); font-size: 12px; border-top: 1px solid var(--line); padding-top: 10px; }
@media (max-width: 860px) {
  .layout { grid-template-columns: 1fr; }
  .picker { position: static; max-height: none; }
  .grid { max-height: 260px; }
  .hero-head { grid-template-columns: 96px 1fr; }
  .hero-head img { width: 96px; }
  .trow { grid-template-columns: 1fr 40px 1fr; }
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><a class="home" href="/" title="返回刀塔账房">刀塔账房</a><small>英雄攻略 · 主流加点 / 天赋 / 中立物品 / 附魔 / 出装</small></div>
    <div class="meta" id="meta">正在加载数据…</div>
  </header>
  <div class="layout">
    <aside class="panel picker">
      <input class="search" id="q" placeholder="搜英雄：中文名、英文名或拼写" autocomplete="off">
      <div class="chips" id="attrs"></div>
      <div class="grid" id="grid"></div>
    </aside>
    <main class="detail" id="detail"><div class="panel empty">在左边点一个英雄</div></main>
  </div>
  <footer id="foot"></footer>
</div>
<script src="/static/heroes.js" defer></script>
</body>
</html>
