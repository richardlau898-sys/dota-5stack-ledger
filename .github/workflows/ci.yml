name: CI

on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["*"]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Lint template literals
        run: python3 tools/lint_templates.py

      - name: Verify hero Chinese localization
        run: python3 tools/refresh_constants.py --check

      - name: Verify static asset hashes
        run: python3 tools/build_static_hashes.py --check

      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Check frontend syntax
        run: node --check static/app.js

      - name: Run healthcheck audit
        run: python3 healthcheck_audit.py
